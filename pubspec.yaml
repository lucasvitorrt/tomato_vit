name: tomato_vit
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.11.1


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  tflite_flutter: ^0.11.0 
  image: ^4.8.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7


flutter:
  uses-material-design: true

  assets:
    - assets/mobilevit_s_fp16.tflite

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21 # Garante compatibilidade com os aparelhos modernos

flutter_native_splash:
  color: "#F5F6FA" # A cor de fundo da  tela
  image: "assets/logo.png" # A mesma logo vai aparecer no meio da tela
  android_12:
    image: "assets/logo.png"
    icon_background_color: "#F5F6FA"